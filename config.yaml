# Tracker policy (requirement 3). The agent can only do what this file allows,
# and nothing it reads on the web can change it: it's loaded once, read-only.

topic: "Open-weight AI model releases"
k: 5

model:
  provider: gemini
  name: gemini-3.5-flash-lite
  temperature: 0.2
  max_output_tokens: 8192
  requests_per_minute: 14  # free tier allows 15; stay just under it
  fallback_name: gemini-3.1-flash-lite  # used if the main model stays overloaded (503) after all retries

instructions: |
  You are a research agent that tracks one topic and reports the most important recent developments.
  Work in this order: search for recent news, fetch the most relevant articles, then call finish.

  What counts as a development: one real-world event, such as a new open-weight model or version
  being released, weights becoming downloadable, a license change, or a major benchmark result for
  an open-weight model. Several articles about the same event are ONE development.

  How to rank: by importance to people who build with open-weight models (capability, how open the
  license is, size and efficiency, who released it). Prefer events from the last two weeks.

  Sources: prefer primary sources (official blogs, model cards, release notes) and reputable news.
  Fetch before you cite: a search result is only a lead, not evidence. Fetch at least one article
  for every development you report, and cite only URLs that fetch_article returned as fetched.
  Many news sites block automated fetching. Primary sources usually don't: the company's own
  blog or news page, the model card on huggingface.co, or the GitHub release. Try those first.
  Summarize each development as 1-4 claims. Each claim is one factual sentence, the URL of a
  fetched article that states it, and one sentence copied word for word from that article as
  evidence. A claim may only say what its source says: no numbers, dates, or details from other
  articles or from search snippets. If a development has no fetched source, leave it out: a
  shorter verified list beats a full unverified one.

  Keys: give each development a stable key "org/model/event" in lowercase, for example
  "qwen/qwen-4/release". If it matches a known development from an earlier run, reuse that key.

  Budget: every tool result shows what is left. Call finish before you run out.

tools: [search_web, fetch_article, finish]

limits:
  max_steps: 25            # model calls per run
  max_searches: 8          # search_web calls (1 Tavily credit each)
  max_fetches: 15          # fetch_article calls
  max_total_tokens: 500000 # prompt + output + thinking, summed over the run
  max_wall_seconds: 600

fetch:
  allowed_schemes: [http, https]
  allowed_ports: [80, 443]
  allowed_hosts: ["*"]     # "*" = any public host; or list domains (subdomains included)
  blocked_hosts: []        # always refused, e.g. ["example.org"]
  timeout_seconds: 10      # per connect/read
  total_timeout_seconds: 20
  max_bytes: 2000000       # stop downloading after 2 MB
  max_redirects: 5
  max_chars_to_model: 8000

search:
  provider: tavily
  max_results: 6
  search_depth: basic      # 1 credit per search ("advanced" costs 2)
  topic: news
  time_range: week         # only results from the last 7 days

retry:                     # transient failures only (timeouts, 5xx, per-minute 429)
  max_attempts: 6
  base_delay_seconds: 1    # 1s, 2s, 4s, 8s, 16s (+ jitter) between attempts
  max_delay_seconds: 60    # a server asking us to wait longer than this = treat as quota
